[client]
window_title = Ragnarok
width = 1024
height = 768
run_elevated = 0       ; 1 = pedir admin
force_resize = 1       ; 0 para não tentar WinMove
auto_run_if_missing = 0 ; 0 = nunca abrir novo ragexe
debug = 1              ; gera plugins/autoLogin/autoLogin.log

[driver]
use_ahi = 1                 ; 1 = usa driver (AHI) + fallback scancode
keyboard_id = 1             ; (opcional) ID exato do teclado no AHI (use ID OU index)
keyboard_index = 0          ; (opcional) índice na lista do AHI (se não passar keyboard_id)

[ports]
6901 = C:\Gravity\RagnarokX1\ragexe.exe
6902 = C:\Gravity\RagnarokX2\ragexe.exe
6903 = C:\Gravity\RagnarokX3\ragexe.exe

[flow_default]
server_index = 0
char_slot = 0
pass_fill = aaaa
try_confirm_enter = 0
after_char_press_enter = 1
after_char_enter_delay = 2000   ; ms

[coords_1024x768]
char_x = 160
char_y = 220
play_x = 890
play_y = 620

[autoLogin]
autoLogin_debounce=45
autoLogin_wait_delay=2
autoLogin_listen_stable=2