[client]
window_title = Ragnarok
width = 1024
height = 768
run_elevated = 0       					; sempre 0! 1 precisaria confirmar admin, e isso bugaria o script.
force_resize = 1       					; útil se você quiser forçar o tamanho da janela
auto_run_if_missing = 0 				; não abrir ragexe sozinho se não achar
debug = 1              					; manter log

[driver]
use_ahi = 1                 				; usa driver (AHI) + fallback (Necessário! Sempre 1)
keyboard_id = 1             				; id do teclado (use id OU index)
keyboard_index = 0          				; index do teclado (NUNCA USE OS DOIS JUNTOS)

[ports]
6901 = C:\Gravity\Ragnarok\ragexe.exe			; PATH do seu ragexe.exe
6902 = C:\Gravity\Ragnarok\ragexe.exe			; configure de acordo com cada porta usada por bot
6903 = C:\Gravity\Ragnarok\ragexe.exe			; funciona com profiles
